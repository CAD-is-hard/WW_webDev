<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Alignment</title>
        <meta charset="UTF-8">
        <style>
            button{
                padding: 20px;
                margin: 8px;
            }
            #box, #boxTwo{
                width: 75px;
                height: 75px;
                background-color: blue;
                color: azure;
                text-align: center;
            }
            #box-wrapper{
                display: grid;
                grid-template-columns: 1fr 200px 1fr;
                gap: 5px;
            }
            #flex-wrapper{
                display: none;
                flex-direction: row;
                justify-content: space-between;
                align-items: center;
                flex-wrap: wrap;
            }
            #cat{
                width: 200px;
            }
            
        </style>
    </head>
    <body>
        <h1>Alignment Notes</h1>
        <img src="https://images.rawpixel.com/image_800/cHJpdmF0ZS9sci9pbWFnZXMvd2Vic2l0ZS8yMDIyLTA1L2ZyYW5pbWFsX2NhdF9raXR0ZW5fYnJpdGlzaC1pbWFnZS1reWJlYXlrNC5qcGc.jpg" alt="cat" id="cat" onmouseout="changeImage()" >
        <div id="box-wrapper">  
            <div id="box" onmouseover="disappear()" onmouseout="appear()">
                <p>Box 1</p>
            </div>
            <div id="boxTwo">
                <p>Box 2</p>
            </div>
            <div id="box">
                <p>Box 3</p>
            </div>
            <div id="box">
                <p>Box 4</p>
            </div>
        </div>
          <div id="flex-wrapper">
            <div id="box">
                <p>Box 1</p>
            </div>
            <div id="box">
                <p>Box 2</p>
            </div>
            <div id="box">
                <p>Box 3</p>
            </div>
            <div id="box">
                <p>Box 4</p>
            </div>
        </div>
        <input type="color" id="colorPicker">
        <br>
        <button onclick="color()">Click Me</button>
        <button id="showMore" onclick="show()">Show More</button>
        <script>
            //MAKES IT INTERACTIVE
            let images = ["https://images.rawpixel.com/image_800/czNmcy1wcml2YXRlL3Jhd3BpeGVsX2ltYWdlcy93ZWJzaXRlX2NvbnRlbnQvbHIvcGR2YW5nb2doLXNudmdyb2IuanBn.jpg", "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT9jN9mW33D19P645u-L2587z6-J71DsNcvOV0taMV4rA&s=10", "https://images.rawpixel.com/image_800/cHJpdmF0ZS9sci9pbWFnZXMvd2Vic2l0ZS8yMDIyLTA1L2ZyYW5pbWFsX2NhdF9raXR0ZW5fYnJpdGlzaC1pbWFnZS1reWJlYXlrNC5qcGc.jpg", "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRd6p7a-spsVrmgA2uuYvWlR-4qMt98nHdNMzAfKTZONQ&s=10"]
            let current = 0
            function changeImage(){
                current += 1
                if (current > 2){
                    current = 0
                }
                document.getElementById("cat").src = images[current]
            }
            function color(){
                let newColor = document.getElementById("colorPicker").value
                document.getElementById("box").style.backgroundColor = newColor
            }
            function disappear(){
                document.getElementById("boxTwo").style.display = 'none'
            }
            function appear(){
                document.getElementById("boxTwo").style.display = "block"
            }
            function show(){
                let element = document.getElementById("flex-wrapper")
                if (element.style.display == "flex"){
                    element.style.display = "none"
                    document.getElementById("showMore").innerHTML = "Show More"
                }else{
                    element.style.display = "flex"
                    document.getElementById("showMore").innerHTML = "Show Less"
                }
            }
        </script>
    </body>
</html>
