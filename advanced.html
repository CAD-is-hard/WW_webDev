    <body>
        <h1>Advanced HTML Notes</h1>
        <h3>Lists:</h3>
        <div>
        <ol type="I"><!--This is an ordered/numbered list.-->
            <li>This is the first thing</li>
            <li>This is the second</li>
            <li>This comes in third</li>
        </ol>
        <ul>
            <li>Apple</li>
            <li>Banana</li>
            <li>Orange</li>
            <li>Kiwi</li>
        </ul>
        <dl>
            <dt>Fall</dt>
            <dd>Halloween</dd>
            <dd>Thanksgiving</dd>
            <dt>Winter</dt>
            <dd>Christmas</dd>
            <dd>Hanukkah</dd>
            <dd>New Years</dd>
        </dl>
        </div>
