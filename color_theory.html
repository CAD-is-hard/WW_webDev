<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Color Theory</title>
        <meta charset="UTF-8">
        <style>
            #complementary{
                background-color: orange;
                border: solid 3px blue;
                width: 150px;
                height: 150px;
            }
            #analagous{
                background-color: blueviolet;
                border: solid 3px #c71585;
                color: violet;
                width: 150px;
                height: 150px;
            }
            #triadic{
                background-color: green;
                border: solid 3px violet;
                color: orange;
                width: 150px;
                height: 150px;
            }
        </style>
    </head>
    <body>
        <h1>Color Theory</h1>
        <div  id="complementary">
        <p> This is complementary colors, opposite on the color wheel.</p>
        </div>
        <div id="analagous">
        <p>These are analagous colors, right next to eachother on the wheel.</p>
        </div>
        <div id="triadic">
            <p>These are triadic colors, evenly spaced around the wheel.</p>
        </div>
    </body>
</html>
