<!DOCTYPE html>
<html lang = "en">
    <head>
        <title>Advanced HTML Notes</title>
        <meta charset="UTF-8">
        <style>
            /* Cascading Style Sheets
            1. Selector
            2. Declaration
                a.property
                b. value*/
             body{
                color:rgb(2, 134, 106);
                background-color: oklch(0% 0 0);
             }
             h1{
                color: rgb(233, 49, 49);
            text-decoration: underline;
        text-align: center;}
            #even{
                color: #fabc87;
            }
            .numbered{
                font-size: 20px;
            }
            ul{
                background-color: rgba(58, 53, 53, 0.384);
                border-radius: 5px;
                width: 130px;
                height: 100px;
                font-size: 1em;
                border: solid 3px orange;
            }
            #jabble{
                width: 259px;
            }
            #gilbab{
                width: 259px;
            }
        </style>
    </head>
    <body>
        <h1>Advanced HTML Notes</h1>
        <h3>Lists:</h3>
        <div>
        <ol type="I" class="numbered"><!--This is an ordered/numbered list.-->
            <li>This is the first thing</li>
            <li id="even">This is the second</li>
            <li>This comes in third</li>
        </ol>


        <ul>
            <li>Apple</li>
            <li id="even">Banana</li>
            <li>Orange</li>
            <li>Kiwi</li>
        </ul>
        <dl>
            <dt id="even">Fall</dt>
            <dd>Halloween</dd>
            <dd>Thanksgiving</dd>
            <dt>Winter</dt>
            <dd>Christmas</dd>
            <dd>Hanukkah</dd>
            <dd>New Years</dd>
        </dl>
        </div>
        <h3>Attributes</h3>
        <div>
        <a href="https://pointerpointer.com/" target="_blank"><img src="https://globalsummitguide.com/wp-content/uploads/2026/07/AdobeStock_1146206325-scaled.jpeg" alt="Mount timp" id="jabble"></a>
        <a href="https://puginarug.com/" target="_blank"><img src="Mount_Timpanogos_at_sunset.jpg" alt="Snuset on timp" id="gilbab"></a>    
        <p>Image from <a href="https://commons.wikimedia.org/wiki/File:Mount_Timpanogos_at_sunset.jpg" target="_blank">Wikimedia commons</a></p>
        </div>
    </body>
</html>
